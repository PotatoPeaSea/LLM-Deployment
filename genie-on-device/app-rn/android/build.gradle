buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        // 27, not 23, because the GenieX SDK (com.qualcomm.qti:geniex-android)
        // requires it. No loss here: the target is a QCS8550 devkit on
        // Android 13, and the QAIRT runtime never supported Android 6-7 anyway.
        minSdkVersion = 27
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
