apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.geniechatrn"
    defaultConfig {
        applicationId "com.geniechatrn"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // QAIRT ships an Android runtime for arm64 only, and the target is a
        // QCS8550 devkit -- other ABIs would only slow the build down.
        ndk { abiFilters "arm64-v8a" }

        externalNativeBuild {
            cmake { arguments "-DANDROID_STL=c++_shared" }
        }
    }

    // The JNI bridge onto Genie. Staged, not committed:
    // scripts/09_stage_qairt_for_app.sh app-rn/android
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // extractNativeLibs=true, deliberately. FastRPC hands the DSP skel's PATH
    // to the DSP, which has to open a real file; left compressed inside the APK
    // there is no such file and QnnDevice_create fails with
    // "Failed to load skel, error: 1002".
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += "**/*.so"

            // Two QAIRT stacks end up in this APK: the one staged into
            // src/main/jniLibs (09_stage_qairt_for_app.sh) that libGenie.so is
            // built against, and a newer-QAIRT copy the GenieX AAR bundles.
            // They collide on these three filenames, and OUR staged copies must
            // win -- the QAIRT set has to be internally consistent or Genie
            // crashes reaching across a version boundary.
            //
            // libQnnHtpNetRunExtensions.so is the one that actually bit us:
            // Genie dlopens it by name to apply htp_backend_ext_config.json, and
            // taking the AAR's newer-QAIRT copy against our older libGenie.so
            // SIGSEGVs inside it during GenieDialog_create (fault addr 0x18,
            // just after QnnBackend_create logs success). Staging our matching
            // copy (a611b6f..., same QAIRT as libGenie/libQnnHtp) and pinning it
            // here fixes the NPU-wide crash. libQnnHtp/libQnnSystem collide too;
            // GenieX itself is unaffected -- its NPU path is the llama_cpp
            // plugin (libggml-hexagon + libggml-htp-v73), no QNN library at all.
            pickFirsts += ["lib/arm64-v8a/libQnnHtp.so",
                           "lib/arm64-v8a/libQnnSystem.so",
                           "lib/arm64-v8a/libQnnHtpNetRunExtensions.so"]

            // This device's DSP is v73 only. The GenieX AAR also drags in
            // libQnnHtpV79/V81* + libQnnNetRunDirectV79/V81* (~40MB for hardware
            // we don't have). Harmless to drop; keeps the APK's arch set clean.
            excludes += ["lib/arm64-v8a/libQnnHtpV79*.so",
                        "lib/arm64-v8a/libQnnHtpV81*.so",
                        "lib/arm64-v8a/libQnnNetRunDirectV79*.so",
                        "lib/arm64-v8a/libQnnNetRunDirectV81*.so"]
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // Off-device tests for the context arithmetic (ChatEngineContextTest).
    testImplementation("junit:junit:4.13.2")

    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // GenieX: the GGUF/llama.cpp runtime, used only by the Qwen3.5-2B model.
    // Ships its own arm64 .so set (libgeniex*, libggml*, libllama*), so unlike
    // the Genie C API path there is no CMake/JNI of ours involved.
    //
    // NOTE on vision: neither this version nor the newer 0.3.16 can load the
    // community Qwen3.5-2B vision projector -- its clip.cpp does not support the
    // `qwen3vl_merger` projector type and aborts with "failed to seek for tensor
    // mm.2.bias". The app detects this at load (GenieXEngine.visionReady) and
    // declines images gracefully instead of crashing. Bump this dependency once
    // GenieX ships qwen3vl_merger support and vision lights up with no code
    // change. Local-AAR 0.3.16 was tried and rejected (same failure, 80MB blob).
    implementation("com.qualcomm.qti:geniex-android:0.3.12")

    // generateStreamFlow returns a Flow; the engine collects it from a worker.
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
